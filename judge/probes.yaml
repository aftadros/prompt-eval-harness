_note: 'Constructed probe pairs with known-correct verdicts. These are not cases and never
  enter a run: they exist so `judge-audit` measures the judge against something external rather
  than against itself.


  Verbosity pairs hold content constant and manipulate only length, which is cleaner than
  regressing length against quality on observational data, where length and quality are correlated
  for real reasons. The padding adds no claim, removes none, and changes none; each pair was
  checked by hand.


  Position pairs put a well-grounded answer against a plausible ungrounded one. Judged in
  both orders with the same question, an unbiased judge flips its verdict when the better
  answer changes slots.'
