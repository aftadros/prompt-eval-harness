# Ordinary bucket: 20 questions a practitioner would actually ask, each answered
# completely by one section of one post, phrased the way someone with the problem
# would phrase it rather than the way the heading is worded.
#
# Every case carries at least one distractor fixture from a different post. That
# is the falsifiability rule doing work: a case whose checks cannot fail given
# its own context is decoration, and a single-fixture ordinary case passes
# must_cite by having nothing else to cite.

- id: ord-two-timeouts
  input: "Why would I set two different timeouts on an LLM API call instead of just one?"
  context:
    - doc: llm-api-from-php-in-production--two-timeouts
    - doc: llm-cost-at-campus-scale--streaming-and-retries
  checks: [must_cite, cited_ids_exist]
  why: >
    Connect-versus-total is answered completely by one section. The distractor is a
    streaming passage from a different post that shares the words "retries" and
    "connection", so an answer that pattern-matches on vocabulary rather than
    reading will cite it and fail cited_ids_exist against the wrong post.
  source: constructed
  added: 2026-08-17

- id: ord-streaming-cost
  input: "Does streaming the response make the model call cheaper?"
  context:
    - doc: llm-cost-at-campus-scale--streaming-and-retries
    - doc: llm-api-from-php-in-production--two-timeouts
  checks:
    - must_cite
    - cited_ids_exist
  judge: [grounded, answers_the_question]
  why: >
    The answer is no, and the reason is a second-order one: streaming is a cost
    control because it stops impatient users generating a second request, not
    because it changes any token price. A model that reads "cost control" and
    stops there gets the verdict right for the wrong reason, which the grounded
    judge question catches and a keyword check would not.
  source: constructed
  added: 2026-08-17

- id: ord-cache-ordering
  input: "How should I order my prompt so prefix caching actually pays off?"
  context:
    - doc: llm-cost-at-campus-scale--caching-the-stable-prefix
    - doc: llm-cost-per-request--one-line-item-per-call
  checks: [must_cite, cited_ids_exist]
  why: >
    Stable first, volatile last. The distractor is the cost-accounting post's
    cached-versus-uncached token split, which is adjacent enough to look like an
    answer and does not contain the ordering rule.
  source: constructed
  added: 2026-08-17

