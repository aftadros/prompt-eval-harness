- id: ord-repair-once
  input: "The model keeps returning malformed JSON. How many times should I retry before giving up?"
  context:
    - doc: llm-json-in-php--one-repair-attempt
    - doc: llm-api-from-php-in-production--which-failures-to-retry
  checks:
    - must_cite
    - cited_ids_exist
  why: >
    One repair attempt with the error fed back, then fall through to the no-model
    path. The distractor is the transport-level retry policy from a different
    post, whose hard cap of three attempts is a real number about a different
    kind of retry, so an answer that grabs the nearest digit gets it wrong.
  source: constructed
  added: 2026-08-17

- id: ord-escalation-routing
  input: "What's the pattern for routing between a cheap model and an expensive one?"
  context:
    - doc: llm-cost-at-campus-scale--which-model-gets-the-question
    - doc: shipping-llm-features-safely--what-the-user-sees-when-the-model-is-down
  checks: [must_cite, cited_ids_exist]
  why: >
    Cheap first, escalate on a confidence or guardrail flag, because it fails
    toward quality. The distractor is a degradation passage from a different post
    that also describes falling back between paths, for unrelated reasons.
  source: constructed
  added: 2026-08-17

