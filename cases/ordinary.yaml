    - doc: did-the-prompt-change-help--the-average-is-where-a-regression-goes-to-hide
  checks: [must_cite, cited_ids_exist]
  why: >
    One narrow yes-or-no question, source in hand, verdict before explanation. The
    distractor is about reading results rather than producing them.
  source: constructed
  added: 2026-08-17

- id: ord-properties-over-judges
  input: "When should I use a property check instead of having a model grade the answer?"
  context:
    - doc: did-the-prompt-change-help--build-the-set-from-real-questions-including-the
    - doc: evals-before-vibes--llm-as-judge-and-where-it-lies-to-you
  checks: [must_cite, cited_ids_exist]
  judge: [grounded, answers_the_question]
  why: >
    Properties anywhere the question allows, fuzzy grading saved for answers that
    need real judgment, because properties are cheaper to write, cheaper to run,
    and do not drift between runs. Both fixtures are genuinely relevant, so this
    tests synthesis without the traps of the known-hard bucket.
  source: constructed
  added: 2026-08-17

- id: ord-per-request-unit
  input: "Why track cost per request rather than just watching the monthly bill?"
  context:
    - doc: llm-cost-per-request--why-the-unit-is-the-request
    - doc: llm-cost-at-campus-scale--tokens-are-the-row-count
  checks: [must_cite, cited_ids_exist]
  why: >
    Acted on the same day, and it survives traffic growth in a way a total does
    not. The distractor from the other cost post covers token pricing and touches
    the same metric without making the argument for the unit.
  source: constructed
  added: 2026-08-17

- id: ord-least-privilege-tools
  input: "How should I scope the tools I give a model that reads retrieved documents?"
  context:
    - doc: prompt-injection-is-untrusted-input--least-privilege-for-tools
    - doc: rag-over-internal-docs--citations-end-to-end
  checks: [must_cite, cited_ids_exist]
  why: >
    Narrowest scope that still works, confirmation on destructive or outbound
    actions, tool arguments validated as if a stranger typed them, and distance in
    the flow between untrusted text and a loaded tool.
  source: constructed
  added: 2026-08-17

- id: ord-schema-valid-not-correct
  input: "If I use structured outputs, do I still need to validate the response?"
  context:
    - doc: structured-outputs--what-it-didnt-fix
    - doc: llm-json-in-php--send-the-schema
  checks: [must_cite, cited_ids_exist]
  judge: [grounded, answers_the_question]
  why: >
    Yes: the schema is a type system and guarantees shape, never sense. Both
    fixtures support the answer from different angles, so the case tests whether
    the model can hold "the format problem is solved" and "the value problem is
    not" at the same time.
  source: constructed
  added: 2026-08-17
