- id: ord-jitter
  input: "Why add jitter to retry backoff?"
  context:
    - doc: llm-api-from-php-in-production--which-failures-to-retry
    - doc: shipping-llm-features-safely--the-circuit-breaker
  checks: [must_cite, cited_ids_exist]
  why: >
    Keeps a fleet from retrying in lockstep against a provider that is already
    struggling. The distractor is the breaker section, which is the other half of
    the same defense and does not mention jitter.
  source: constructed
  added: 2026-08-17

- id: ord-citation-validation
  input: "Should I check the model's citations before showing them to a user?"
  context:
    - doc: rag-over-internal-docs--citations-end-to-end
    - doc: evals-before-vibes--the-golden-set
  checks: [must_cite, cited_ids_exist]
  why: >
    Yes, and the reason is stated: a citation that does not resolve to a retrieved
    document is worse than no citation because it manufactures confidence. This
    case is also self-referential in a useful way, since cited_ids_exist is the
    check that enforces the same rule on the answer to it.
  source: constructed
  added: 2026-08-17

- id: ord-metadata-filter
  input: "Is it better to filter chunks on metadata or let the embedding handle it?"
  context:
    - doc: rag-over-internal-docs--chunking-decides-what-retrieval-can-find
    - doc: prompt-injection-in-rag--push-the-defense-earlier-than-the-prompt
  checks: [must_cite, cited_ids_exist]
  judge: [grounded, answers_the_question]
  why: >
    Filter first, rank second, because it is cheaper and more accurate than asking
    the embedding to encode access scope and dates. The distractor filters at
    retrieval too, for security rather than accuracy, which is a genuinely close
    call and the reason this case sits at the top of the ordinary bucket's
    difficulty range.
  source: constructed
  added: 2026-08-17

- id: ord-judge-protocol
  input: "How should I phrase the question I send to an LLM judge?"
  context:
