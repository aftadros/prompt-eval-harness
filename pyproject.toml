[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-eval-harness"
version = "0.1.0"
description = "A small harness for telling whether a prompt change actually helped."
requires-python = ">=3.11"
dependencies = ["pyyaml"]
license = {file = "LICENSE"}

# The repo is meant to be run from a clone (`python -m harness ...`), and that
# path needs only PyYAML. This block exists so `pip install .` also works rather
# than dying on flat-layout auto-discovery; the data directories (cases, corpus,
# fixtures, judge, prompts, runs) stay out of the wheel on purpose.
[tool.setuptools]
packages = ["harness", "checks"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
